name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Native sources (qwentts.cpp, shine)
        run: bash scripts/fetch_deps.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Native libraries in the APK
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "lib/arm64" | awk '{printf "%8.1f MB  %s\n", $1/1048576, $4}'

      - name: Rename
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/VoiceStudio-1.0.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-apk
          path: out/*.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk \
            --title "語音工作室 1.0.${{ github.run_number }}" \
            --notes "自動編譯版本 ${{ github.sha }}。在手機上下載 .apk 安裝（需要允許安裝未知來源的應用程式）。" \
            --latest
