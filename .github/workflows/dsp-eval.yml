name: DSP eval (old vs new post-processing)

# Post-processes the takes in the dsp-samples branch with the previous and the current algorithm and
# scores them: UTMOS (predicted naturalness, 1..5), DNSMOS and whisper character error rate.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: dsp-samples, path: takes }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Process
        run: |
          curl -sSL -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p cls && javac -encoding UTF-8 -cp json.jar -d cls android/app/src/main/java/tw/rfps/voicestudio/{Dsp,Voice,Store,Pron}.java scripts/DspAB.java
          mkdir -p ab && java -cp cls:json.jar DspAB examples/校園安全時光機.voiceproj.json takes ab
          java -Dvsnoalign=1 -cp cls:json.jar DspAB examples/校園安全時光機.voiceproj.json takes ab
      - name: Score
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q librosa faster-whisper pyworld soundfile
          git clone -q --depth 1 -b v1.2.0 https://github.com/tarepan/SpeechMOS.git /tmp/SpeechMOS
          python3 - <<'P'
          import glob, json, numpy as np, librosa, torch, warnings, difflib, re
          warnings.filterwarnings('ignore')
          from faster_whisper import WhisperModel
          utmos = torch.hub.load('/tmp/SpeechMOS', 'utmos22_strong', source='local', trust_repo=True)
          wm = WhisperModel('small', device='cpu', compute_type='int8')
          log = {e['id']: e for e in json.load(open('takes/log.json'))}
          # reference: WORLD vocoder (pitch + spectral-envelope warp), to see what a vocoder approach would score
          import pyworld as pw, soundfile as sf
          for f in glob.glob('ab/*_0clean.wav'):
              prm = json.load(open(f.replace('_0clean.wav', '.json')))
              x, sr = sf.read(f); x = x.astype(np.float64)
              f0, t = pw.harvest(x, sr, f0_floor=60, f0_ceil=700, frame_period=5)
              sp = pw.cheaptrick(x, f0, t, sr); ap = pw.d4c(x, f0, t, sr)
              a = prm['formant']; n = sp.shape[1]; fr = np.arange(n)
              sp2 = np.array([np.interp(fr / a, fr, row) for row in sp])
              ap2 = np.array([np.interp(fr / a, fr, row) for row in ap])
              y = pw.synthesize(f0 * prm['ratio'], sp2, ap2, sr, 5)
              sf.write(f.replace('_0clean', '_6world'), (y / max(1e-6, np.abs(y).max()) * 0.8).astype(np.float32), sr, subtype='PCM_16')
          keys = ['0clean', '1old', '2new', '2newNA', '3pitch', '3pitchNA', '4form', '4formNA', '6world', '8revO', '8revN', '9echO', '9echN', '9echD', 'AlayO', 'AlayN', 'BgrlO', 'BgrlN']
          tot = {k: {'utmos': [], 'dns': [], 'cer': []} for k in keys}
          def han(t): return re.sub(r'[^一-鿿]', '', t)
          for b in sorted(set(f.rsplit('_', 1)[0] for f in glob.glob('ab/*_0clean.wav'))):
              lid = b.split('/')[-1].split('_')[0]
              ref = han(log[lid]['text']) if lid in log else ''
              row = []
              for k in keys:
                  x, _ = librosa.load(f'{b}_{k}.wav', sr=16000)
                  x = x / max(1e-6, np.abs(x).max()) * 0.9
                  u = float(utmos(torch.from_numpy(x).unsqueeze(0), 16000).item())
                  d = 0.0
                  segs, _ = wm.transcribe(x, language='zh', initial_prompt='以下是繁體中文的句子。')
                  h = han(''.join(s.text for s in segs))
                  sm = difflib.SequenceMatcher(None, ref, h)
                  cer = 1 - sum(m.size for m in sm.get_matching_blocks()) / max(1, len(ref))
                  for n, v in (('utmos', u), ('dns', d), ('cer', cer)): tot[k][n].append(v)
                  row.append('%s U%.2f D%.2f C%.2f' % (k, u, d, cer))
              print(b.split('/')[-1].ljust(14), ' | '.join(row), flush=True)
          for k in keys:
              print('MEAN %-7s UTMOS %.3f  DNSMOS %.3f  CER %.3f' % (k, *(np.mean(tot[k][n]) for n in ('utmos', 'dns', 'cer'))))
          P
