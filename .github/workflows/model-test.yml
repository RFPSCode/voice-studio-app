name: Model test (real Qwen3-TTS on CPU)

# Manual check that the model files download and the example project sounds right.
on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'how many lines of the example project to synthesize'
        default: '12'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check model URLs
        run: |
          python3 - <<'E'
          import json, urllib.request
          cat = json.load(open('android/app/src/main/assets/models.json'))
          for m in cat['models']:
              for f in m['files']:
                  req = urllib.request.Request(f['url'], method='HEAD')
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          print('OK ', r.status, r.headers.get('content-length'), f['name'])
                  except Exception as e:
                      print('BAD', e, f['url'])
          E
          curl -s https://huggingface.co/api/models/Serveurperso/Qwen3-TTS-GGUF | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(s['rfilename'] for s in d.get('siblings',[])))"
      - name: Build qwentts.cpp (CPU)
        run: |
          bash scripts/fetch_deps.sh
          cd android/third_party/qwentts.cpp && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release > /dev/null && cmake --build . -j4 --target tts-server > /dev/null && ls -la tts-server
      - name: Download model (Q8_0)
        run: |
          mkdir -p models && cd models
          for f in $(python3 -c "import json;print(' '.join(x['url'] for x in json.load(open('../android/app/src/main/assets/models.json'))['models'][0]['files']))"); do curl -sSL -o "$(basename $f)" "$f"; done
          ls -la
      - name: Synthesize example lines
        run: |
          cd android/third_party/qwentts.cpp/build
          ./tts-server --model ../../../../models/qwen-talker-1.7b-customvoice-Q8_0.gguf --codec ../../../../models/qwen-tokenizer-12hz-Q8_0.gguf --port 8080 --lang chinese > /tmp/server.log 2>&1 &
          for i in $(seq 120); do curl -s localhost:8080/health && break; sleep 2; done
          cd $GITHUB_WORKSPACE && mkdir -p out && python3 - "${{ github.event.inputs.lines }}" <<'E'
          import json, sys, time, urllib.request
          p = json.load(open('examples/校園安全時光機.voiceproj.json'))
          roles = {r['id']: r for r in p['roles']}
          def role_seed(r):  # same as Store.roleSeed (Java 64-bit hash)
              if 'seed' in r: return r['seed']
              h = 1125899906842597
              for ch in r['id']: h = (31 * h + ord(ch)) & 0xFFFFFFFFFFFFFFFF
              return (h & 0x7fffffff) % 1000000007
          log = []
          for l in p['lines'][:int(sys.argv[1])]:
              r = roles[l['role']]
              ins = '；'.join(x for x in [p.get('instruct',''), r.get('instruct',''), l.get('instruct',''), '說話乾淨俐落，不要喘氣或發出多餘的聲音，句子中間不要停頓太久'] if x)
              body = {'input': l.get('say') or l['text'], 'voice': r['speaker'], 'language': 'chinese', 'instructions': ins, 'response_format': 'wav', 'temperature': 0.8, 'seed': role_seed(r)}
              t0 = time.time()
              req = urllib.request.Request('http://localhost:8080/v1/audio/speech', data=json.dumps(body).encode(), headers={'Content-Type': 'application/json'})
              wav = urllib.request.urlopen(req, timeout=900).read()
              dt = time.time() - t0
              open('out/%s_%s.wav' % (l['id'], l['role']), 'wb').write(wav)
              dur = (len(wav) - 44) / 48000
              log.append({'id': l['id'], 'role': l['role'], 'text': l['text'], 'secs': round(dt, 1), 'dur': round(dur, 2), 'rtf': round(dt / max(dur, .1), 2)})
              print(log[-1], flush=True)
          json.dump(log, open('out/log.json', 'w'), ensure_ascii=False, indent=1)
          E
          tail -20 /tmp/server.log
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Post-processing (same Java code as the phone)
        run: |
          curl -sSL -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p cls && javac -encoding UTF-8 -cp json.jar -d cls android/app/src/main/java/tw/rfps/voicestudio/Dsp.java android/app/src/main/java/tw/rfps/voicestudio/Store.java scripts/DspCheck.java
          python3 - <<'P'
          import json, subprocess
          p = json.load(open('examples/校園安全時光機.voiceproj.json')); roles = {r['id']: r for r in p['roles']}
          log = json.load(open('out/log.json')); f0s = {}
          for e in log:   # the role's typical pitch = median of its lines, as on the phone
              v = float(subprocess.run(['java', '-cp', 'cls:json.jar', 'DspCheck', '--f0', 'out/%s_%s.wav' % (e['id'], e['role'])], capture_output=True, text=True).stdout.strip() or 0)
              if v > 0: f0s.setdefault(e['role'], []).append(v)
          base = {k: sorted(v)[len(v) // 2] for k, v in f0s.items()}
          print('role base pitch', base)
          for e in log:
              post = roles[e['role']].get('post') or {}
              f = 'out/%s_%s.wav' % (e['id'], e['role'])
              subprocess.run(['java', '-cp', 'cls:json.jar', 'DspCheck', f, f.replace('.wav', '_child.wav'), json.dumps(post, ensure_ascii=False), '0.5' if '…' in e['text'] else '0.3', str(base.get(e['role'], 0))], check=True)
          P
      - name: Transcribe (check the words)
        run: |
          pip install -q faster-whisper
          python3 - <<'E'
          import json, glob
          import wave, numpy as np
          from faster_whisper import WhisperModel
          m = WhisperModel('small', device='cpu', compute_type='int8')
          def load(f):
              w = wave.open(f); a = np.frombuffer(w.readframes(w.getnframes()), np.int16).astype(np.float32) / 32768
              sr = w.getframerate(); n = int(len(a) * 16000 / sr)
              return np.interp(np.arange(n) * sr / 16000, np.arange(len(a)), a).astype(np.float32)
          log = json.load(open('out/log.json'))
          import os
          for e0 in list(log):
              c = 'out/%s_%s_child.wav' % (e0['id'], e0['role'])
              if os.path.exists(c): log.append(dict(e0, id=e0['id'] + '_child', file=c))
          for e in log:
              segs, _ = m.transcribe(load(e.get('file') or 'out/%s_%s.wav' % (e['id'], e['role'])), language='zh', initial_prompt='以下是繁體中文的句子。')
              e['heard'] = ''.join(s.text for s in segs)
              print(e['id'], e['text'], '=>', e['heard'], flush=True)
          json.dump(log, open('out/log.json', 'w'), ensure_ascii=False, indent=1)
          E
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-test
          path: out/
