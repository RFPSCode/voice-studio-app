plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.rfps.voicestudio'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'tw.rfps.voicestudio'
        minSdk 29
        targetSdk 35
        versionCode (System.getenv('VS_VERSION_CODE') ?: '1') as int
        versionName '1.0.' + (System.getenv('VS_VERSION_CODE') ?: '0')
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
                cFlags '-O3'
                cppFlags '-O3'
            }
        }
    }

    signingConfigs {
        release {
            // a fixed key so that new versions install over old ones (personal / classroom use)
            storeFile file('voicestudio.keystore')
            storePassword 'voicestudio'
            keyAlias 'voicestudio'
            keyPassword 'voicestudio'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging { jniLibs { useLegacyPackaging false } }
}
